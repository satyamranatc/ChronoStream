name: Cross-Platform CI (macOS & Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test macOS (Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Release Binary
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test

  build-windows:
    name: Typecheck & Build Windows (Electron)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: windows
        run: npm install

      - name: Typecheck & Production Build
        working-directory: windows
        run: |
          npm run typecheck
          npm run build:web
