name: Release macOS & Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Publish macOS (.dmg & .zip)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & Package macOS Release Artifacts
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh "${{ steps.meta.outputs.version }}"

      - name: Upload macOS Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ChronoStream ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/ChronoStream-${{ steps.meta.outputs.version }}-arm64.dmg
            dist/ChronoStream-${{ steps.meta.outputs.version }}-arm64.zip
            dist/SHA256SUMS.txt

  release-windows:
    name: Build & Publish Windows (.exe Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows App Dependencies
        working-directory: windows
        run: npm install

      - name: Typecheck & Build Windows NSIS Installer (.exe)
        working-directory: windows
        run: |
          npm run typecheck
          npm run build:win

      - name: Upload Windows Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ChronoStream ${{ github.ref_name }}"
          files: |
            windows/dist-installer/*.exe
            windows/dist-installer/*.blockmap
